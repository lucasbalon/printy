name: Printy
version: "0.3.10"
slug: printy
description: Bibliothèque de fichiers, imprimantes 3D et planning d'impression
url: https://github.com/lucasbalon/printy
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:printer-3d
panel_title: Printy
homeassistant_api: true
# Backed up while running: a consistent copy of the database is made just before
backup: hot
backup_pre: python3 -m printy.backup /data/printy.db
services:
  - mqtt:want
map:
  - type: share
    read_only: false
  - type: homeassistant_config
    read_only: false
ports:
  8099/tcp: 5300
ports_description:
  8099/tcp: Envoi depuis le trancheur (API compatible OctoPrint)
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
